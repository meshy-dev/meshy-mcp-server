name: Publish to npm

# No npm token is stored anywhere: the package publishes through npm trusted
# publishing (GitHub OIDC), with provenance. On npmjs.com it trusts
# meshy-dev/meshy-mcp-server, this workflow file (publish.yml) and the
# `release` environment, which only `main` and `v*` tags may deploy to.
# Renaming the file or the environment breaks publishing until the npm setting
# is recreated.

on:
  release:
    types: [published]
  # Manual re-run: the v0.3.0 and v0.4.0 releases are already cut but their
  # publish runs failed, and a GitHub Release only fires `published` once.
  # This lets a fixed pipeline ship an existing tag without re-releasing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.5.0 (defaults to the current ref)"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Guard against tagging one version and shipping another.
      - name: Check package.json version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json is $PKG_VERSION but the release tag is $TAG. Bump package.json (and CHANGELOG.md) before publishing."
            exit 1
          fi
          echo "version $PKG_VERSION matches tag $TAG"

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      # Upgraded only here, so the checks above run on the stock npm.
      - run: npm install -g npm@^11.5.1

      # npm accepts the tarball before it is installable, so a green run is not
      # yet "live": confirm against https://registry.npmjs.org/@meshy-ai/meshy-mcp-server.
      - run: npm publish --access public
